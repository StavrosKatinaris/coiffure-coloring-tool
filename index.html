<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b1020">
  <title>Πελάτες</title>

  <link rel="icon" type="image/png" href="./lm.png">
  <link rel="apple-touch-icon" href="./lm.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <!-- PIN GATE -->
  <section id="gate" class="gateWrap" style="display:none;">
    <div class="gateCard">
      <div class="gateHd">
        <div class="big">Εισαγωγή PIN</div>
        <div class="small">4ψήφιος κωδικός πρόσβασης</div>
      </div>

      <div class="gateBd">
        <input id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" />
        <button class="primary" id="pinBtn">Ξεκλείδωμα</button>
        <div class="status" id="pinStatus"></div>
      </div>
    </div>
  </section>

  <!-- APP -->
  <div class="app" id="appRoot" style="display:none;">

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="left">
        <div>
          <div class="titleRow">
            <div class="title" id="pageTitle">Πελάτες</div>

            <!-- Today's customers toggle (shown only on list view via JS) -->
            <label class="chipToggle" id="todayWrap" style="display:none;">
              <input type="checkbox" id="todayToggle" />
              <span>Σημερινοί πελάτες</span>
            </label>
          </div>

          <div class="sub" id="pageSub">Εργαλείο Βαφών</div>
        </div>
      </div>

      <div class="right">
        <button class="ghost" id="logoutBtn">Αποσύνδεση</button>
      </div>
    </div>

    <!-- STATUS BAR -->
    <div class="statusRow">
      <div class="status" id="status"></div>
      <div class="hint" id="hint">Συμβουλή: Οι σημειώσεις αποθηκεύονται αυτόματα.</div>
    </div>

    <!-- LIST VIEW -->
    <section id="listView">
      <div class="searchRow" id="searchRow">
        <input id="searchInput" placeholder="Αναζήτηση με όνομα ή επώνυμο..." />
      </div>

      <div class="listActions" id="listActions">
        <button class="primary" id="addBtn">Προσθήκη πελάτη</button>
      </div>

      <div class="list" id="list"></div>
    </section>

    <!-- DETAIL VIEW -->
    <section id="detailView" style="display:none;">
      <div class="detailHd">
        <button class="ghost" id="backBtn">← Πίσω</button>
        <div class="detailTitle">
          <div class="big" id="detailName">Πελάτης</div>
          <div class="small" id="detailMeta">ID: —</div>
        </div>
      </div>

      <div class="form">
        <label>Όνομα</label>
        <input id="nameInput" />

        <label>Επώνυμο</label>
        <input id="surnameInput" />

        <label>Τιμή</label>
        <input id="priceInput" />

        <label>Σημειώσεις</label>
        <textarea id="notesInput" rows="6"></textarea>
      </div>

      <div class="detailActions" id="detailActions">
        <button class="primary" id="dailyBtn">Προσθήκη στο σημερινό πρόγραμμα</button>
        <button class="ghost" id="editBtn">Επεξεργασία</button>
        <button class="primary" id="saveBtn" style="display:none;">Αποθήκευση</button>
        <button class="ghost" id="cancelBtn" style="display:none;">Ακύρωση</button>
      </div>
    </section>

    <!-- ADD DIALOG -->
    <dialog id="addDialog">
      <div class="dialogHd">
        <div class="big">Προσθήκη πελάτη</div>
        <button class="ghost" id="closeAddBtn">✕</button>
      </div>

      <div class="form">
        <label>Όνομα</label>
        <input id="addName" />

        <label>Επώνυμο</label>
        <input id="addSurname" />

        <label>Τιμή</label>
        <input id="addPrice" />

        <label>Σημειώσεις</label>
        <textarea id="addNotes" rows="5"></textarea>
      </div>

      <div class="dialogFt">
        <button class="primary" id="createBtn">Δημιουργία</button>
        <div class="status" id="addStatus"></div>
      </div>
    </dialog>

  </div>

  <script src="./app.js"></script>
</body>
</html>
